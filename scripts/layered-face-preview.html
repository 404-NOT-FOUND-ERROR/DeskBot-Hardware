<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeskBot · 高清分层表情</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f5;color:#253d38;font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1160px;margin:auto;padding:42px 28px}small{color:#739288;letter-spacing:.12em}h1{font-size:clamp(28px,4vw,44px);margin:10px 0}p{color:#71847d}section{display:grid;grid-template-columns:360px 1fr;gap:44px;background:#fff;border-radius:30px;padding:32px;margin:28px 0;box-shadow:0 16px 44px #46695009}canvas{width:100%;max-width:360px;border-radius:50%;box-shadow:0 12px 32px #284c3815}h2{font-size:30px;margin:14px 0}nav{display:flex;flex-wrap:wrap;gap:10px}button,a{font:inherit}button{border:1px solid #dce8e1;background:white;color:inherit;border-radius:15px;padding:11px 16px;cursor:pointer;transition:transform .4s cubic-bezier(.18,.9,.25,1.2),box-shadow .4s,background .3s}button:hover{transform:translateY(-3px);box-shadow:0 9px 20px #40745713}button[aria-pressed=true]{background:#d9f4e4;border-color:#86c8a2}#phase{color:#329974}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}#grid button{text-align:left}#grid small{display:block;letter-spacing:0;font-size:11px}.stages{display:flex;gap:8px;margin:22px 0}.stages span{padding:6px 13px;border-radius:10px;background:#f2f6f3;color:#8a9a92;transition:background .4s,color .4s}.stages .active{background:#def4e7;color:#278657}a{color:#338e70}footer{color:#7b8f85;font-size:13px;margin-top:26px}label{display:block;margin:18px 0}@media(max-width:740px){section{grid-template-columns:1fr;padding:24px;gap:20px}canvas{margin:auto}main{padding:25px 18px}}@media(prefers-reduced-motion:reduce){button,.stages span{transition:none}}
</style><main><small>DESKBOT · LAYERED EXPRESSION</small><h1>完整表演，自然接续。</h1><p>480 母版平滑适配圆屏。试试动作途中换一个心情，或随时收尾。</p>
<section><canvas id="face" width="360" height="360" aria-label="圆屏高清分层预览"></canvas><div><span id="phase">准备表情</span><h2 id="label">绿色待机</h2><div class="stages"><span data-phase="entry">进入</span><span data-phase="body">动作主体</span><span data-phase="exit">收尾</span></div><p id="size"></p><nav><button id="replay">再演一次</button><button id="cancel">收尾回待机</button><button id="pause">暂停</button></nav><label><input id="mirror" type="checkbox"> 此表情镜像</label><nav><button id="export">导出镜像设置</button><a href="http://127.0.0.1:8782/#roles">设备工作台 →</a></nav><p>眼白、瞳孔与左右眼分别演出。日常情绪演完回待机，持续状态循环。</p></div></section><div id="grid"></div><footer>此页读取与安装包相同的 DFM1 分层资源。镜像调整可导出后用于重新打包。</footer></main>
<script src="preview.js"></script><script src="device.js"></script><script>
'use strict';const bytes=Uint8Array.from(atob('__DFM_BASE64__'),c=>c.charCodeAt(0)),player=new DeskBotLayeredFace(bytes),report=__BUILD_REPORT__,labels=__LABELS__;
const ctx=document.querySelector('#face').getContext('2d');let selected='happy',paused=false,last=0,overrides={};window.facePlayer=player;
function label(){document.querySelector('#label').textContent=labels[player.current]||player.current;document.querySelector('#phase').textContent=({idle:'绿色待机',entry:'进入',body:'完整动作主体',exit:'收尾回待机'})[player.phase];document.querySelectorAll('[data-phase]').forEach(el=>el.classList.toggle('active',el.dataset.phase===player.phase));document.querySelectorAll('[data-expression]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.expression===selected)));document.querySelector('#mirror').checked=player.clips[selected].mirror;}
for(const name of player.names.filter(n=>!(player.flags&1)||n!=='sleepy')){const b=document.createElement('button');b.dataset.expression=name;b.innerHTML=(labels[name]||name)+'<small>'+name+'</small>';b.onclick=()=>{selected=name;player.request(name);label();};document.querySelector('#grid').append(b);}
document.querySelector('#size').textContent=`360 × 360 · 25 fps · 安装包 ${(report.package_bytes/1048576).toFixed(2)} MiB · 余量 ${(report.partition_free_bytes/1048576).toFixed(2)} MiB`;
document.querySelector('#cancel').onclick=()=>{player.cancel();label();};document.querySelector('#replay').onclick=()=>{player.request(selected,true);label();};document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'继续':'暂停';};
document.querySelector('#mirror').onchange=e=>{const aliases=report.aliases||{},target=aliases[selected]||selected;overrides[target]=e.target.checked;player.clips[target].mirror=e.target.checked;for(const [alias,actual] of Object.entries(aliases)){if(actual===target){delete overrides[alias];player.clips[alias].mirror=e.target.checked;}}player.request(selected,true);label();};
document.querySelector('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(overrides,null,2)+'\n'],{type:'application/json'}));a.download='face-mirror.json';a.click();URL.revokeObjectURL(a.href);};
function tick(t){if(t-last>=40){const elapsed=last?t-last:40;last=t;if(!paused)player.advance(Math.min(elapsed,60000));ctx.drawImage(player.frame(),0,0);label();}requestAnimationFrame(tick);}label();requestAnimationFrame(tick);
DeskBotFaceDevice.mount({report,semantic:()=>selected,labels});
</script></html>
