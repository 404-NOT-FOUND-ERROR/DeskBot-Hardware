<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>新角色 · 表情预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f6;color:#243d3b;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1180px;margin:auto;padding:48px 28px}header small{letter-spacing:.18em;color:#66867e}h1{font-size:clamp(30px,4vw,48px);line-height:1.2;margin:12px 0}p{color:#687e78}section{display:grid;grid-template-columns:360px 1fr;gap:40px;margin:36px 0;background:white;padding:32px;border-radius:28px}canvas{width:100%;max-width:360px;border-radius:50%;background:#000;box-shadow:0 18px 44px #183f391a}h2{font-size:28px}#phase{color:#399c85}nav{display:flex;gap:10px;flex-wrap:wrap}button,a{font:inherit}button{padding:11px 17px;border:1px solid #dce8e3;background:#fff;border-radius:14px;color:#36534b;cursor:pointer;transition:transform .35s cubic-bezier(.2,.85,.25,1),background .25s,box-shadow .3s}button:hover{transform:translateY(-3px);box-shadow:0 9px 18px #385e5012}button[aria-pressed=true]{background:#d8f4e6;border-color:#73bba0}a{color:#298d75}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}#grid button{text-align:left;padding:18px}#grid small{display:block;font-size:12px;color:#81958e}footer{font-size:13px;color:#71847e;margin-top:28px}@media(max-width:740px){section{grid-template-columns:1fr;padding:24px}canvas{margin:auto}main{padding:28px 20px}}@media(prefers-reduced-motion:reduce){button{transition:none}}
</style><main><header><small>DESKBOT · EXPRESSION LIBRARY</small><h1>一整个角色，29 种表达。</h1><p>选择表情，查看与圆屏安装包相同的画面。不同表情经过共同待机姿态衔接。</p></header>
<section><canvas width="360" height="360" aria-label="圆屏表情预览"></canvas><div><span id="phase">正在准备</span><h2 id="label">待机</h2><p id="storage"></p><nav><button id="pause">暂停预览</button><button id="mirror" aria-pressed="false">镜像预览</button><a href="http://127.0.0.1:8782/#roles">打开工作台 →</a></nav><p>完整新角色常驻桌宠。原有角色保留电脑，连接后可换回。</p></div></section><div id="grid"></div><footer>素材来自 AirBoat 表情候选，已适配 360 × 360 圆屏。镜像按钮只调整此页预览，安装设置在工作台保存。</footer></main>
<script id="data" type="application/json">__ROLE_DATA__</script><script>
'use strict';
const data=JSON.parse(document.querySelector('#data').textContent),m=data.manifest,ctx=document.querySelector('canvas').getContext('2d');
const cache=new Map();let current='neutral',wanted='neutral',phase='entry',frame=0,last=0,paused=false,mirror=false;
for(const [id,e] of Object.entries(m.expressions)){const b=document.createElement('button');b.dataset.expression=id;b.innerHTML=e.label+'<small>'+id+'</small>';b.onclick=()=>{wanted=id;paintLabels();};document.querySelector('#grid').append(b);const img=new Image();img.src=e.atlas;cache.set(id,img);}
document.querySelector('#storage').textContent=`安装包 ${(data.package.package_bytes/1048576).toFixed(2)} MiB · 可用余量 ${Math.floor(data.package.partition_free_bytes/1024)} KiB · 默认不镜像`;
function paintLabels(){document.querySelector('#label').textContent=m.expressions[current].label;document.querySelector('#phase').textContent=({entry:'进入',loop:'持续播放',exit:'回归待机'})[phase]+(wanted!==current?' · 接下来 '+m.expressions[wanted].label:'');document.querySelectorAll('[data-expression]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.expression===wanted)));}
function next(){const clip=m.expressions[current].clips[phase];frame++;if(frame<clip.frames)return;frame=0;if(phase==='entry')phase=current===wanted?'loop':'exit';else if(phase==='loop'&&current!==wanted)phase='exit';else if(phase==='exit'){current=wanted;phase='entry';}paintLabels();}
function draw(){const e=m.expressions[current],img=cache.get(current);if(!img.complete||!img.naturalWidth)return;const cell=e.clips[phase].atlas_offset+frame,size=m.atlas.size;ctx.save();ctx.fillStyle='#000';ctx.fillRect(0,0,360,360);if(mirror){ctx.translate(360,0);ctx.scale(-1,1);}ctx.drawImage(img,(cell%m.atlas.columns)*size,Math.floor(cell/m.atlas.columns)*size,size,size,0,0,360,360);ctx.restore();}
function tick(t){if(!paused&&t-last>=1000/m.fps){last=t;next();draw();}requestAnimationFrame(tick);}
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'继续预览':'暂停预览';};document.querySelector('#mirror').onclick=e=>{mirror=!mirror;e.target.setAttribute('aria-pressed',String(mirror));draw();};
paintLabels();requestAnimationFrame(tick);
</script></html>
