_value = VOCAT_BASE_CMD_SET_ACTION_SHARK_HEAD_DECAY;\n        } else if (action == \"look_around\")\n        {\n            action_value = VOCAT_BASE_CMD_SET_ACTION_LOOK_AROUND;\n        } else if (action == \"beat_swing\")\n        {\n            action_value = VOCAT_BASE_CMD_SET_ACTION_BEAT_SWING;\n        } else if (action == \"cat_nuzzle\")\n        {\n            action_value = VOCAT_BASE_CMD_SET_ACTION_CAT_NUZZLE;\n        } else if (action == \"calibrate\")\n        {\n            vocat_base_control_set_calibrate();\n            BaseControl* base_control = board->GetBaseControl();\n            if (base_control != nullptr) {\n                bool completed = base_control->WaitForCalibrationComplete(30000);\n                if (!completed) {\n                    ESP_LOGW(TAG, \"Calibration wait timeout\");\n                    return false;\n                }\n            }\n        } else if (action == \"go_home\")\n        {\n            ui_bridge_switch_page(UI_BRIDGE_PAGE_HOME);\n        } else\n        {\n            return false;\n        }\n\n        if (action_value != -1)\n        {\n            esp_err_t ret = vocat_base_control_set_action(action_value);\n            if (ret != ESP_OK) {\n                ESP_LOGE(TAG, \"Failed to set action: %d\", ret);\n                return false;\n            }\n        }\n        return true;\n    });", "origin": "official_git_blob"}], "runtime_observation": "not_collected", "source_note": "工具直接发底座动作，不自动播放同名 EAF。calibrate 是磁吸校准；go_home 是返回 UI 主页，不是机械回零。", "classification": "protected", "allowed_remove_from_device_profile": false, "disposition": "keep_and_review", "disposition_reason": "保留官方路由；事件事实、情绪、EAF 和动作副作用分列，未观察项不作删除依据。"}, {"row_id": "route:alarm-end", "row_type": "event_route", "event_or_entry": "闹钟 / 番茄钟到时", "event_id": "alarm-end", "group": "系统状态", "condition": "alarm_time_up_set_origin 的睡眠闹钟或番茄钟分支。", "semantic_ids": [], "eaf_ids": [], "output_bindings": [], "resource_bytes_by_id": {}, "shared_object": nu
