name: Portable checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install schema validator
        run: python -m pip install -r tests/requirements-body-facts-validation.txt
      - name: Publication and portable tests
        run: |
          python scripts/check-publication.py
          python scripts/run-offline-checks.py
          python scripts/check-workbenches.py
      - name: C++ magnetic recognition core
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O2 -I firmware/body/main/boards/esp_vocat tests/o2d_magnetic_core_test.cc -o "$RUNNER_TEMP/o2d_magnetic_core_test"
          "$RUNNER_TEMP/o2d_magnetic_core_test"
      - name: Patch whitespace
        run: git diff --check
