name: Portable checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # E1.25/E1.26 source audits compare against a pinned baseline commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install schema validator
        run: python -m pip install -r tests/requirements-body-facts-validation.txt
      - name: Publication and portable tests
        run: |
          python scripts/build-deskbot-studio-e2a.py --check
          node --test tests/deskbot-studio-e2a-core.cjs
          python scripts/build-deskbot-studio-e2b.py --check
          node --test tests/deskbot-studio-e2b-core.cjs
          python scripts/build-deskbot-studio-e2c.py --check
          node --test tests/deskbot-studio-e2c-core.cjs
          python -m unittest discover -s tests -p test_body_console_observation.py
          python -m unittest discover -s tests -p test_deskbot_studio_e3a.py
          python scripts/build-deskbot-studio-e3b.py --check
          python -m unittest discover -s tests -p test_device_link.py
          python -m unittest discover -s tests -p test_deskbot_studio_e3b.py
          python scripts/build-expression-binding-decision-e1-14.py --check
          python scripts/check-publication.py
          python scripts/run-offline-checks.py
          python scripts/check-workbenches.py
      - name: C++ magnetic recognition core
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O2 -UNDEBUG -I firmware/body/main/boards/esp_vocat tests/o2d_magnetic_core_test.cc -o "$RUNNER_TEMP/o2d_magnetic_core_test"
          "$RUNNER_TEMP/o2d_magnetic_core_test"
      - name: Patch whitespace
        run: git diff --check
